[package]
name = "memo-stt"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Oliver Hull <ohull7@gmail.com>"]
description = "Plug-and-play speech-to-text for Rust. Add local Whisper transcription to any app in a few lines, with automatic GPU acceleration and zero configuration."
license = "MIT"
repository = "https://github.com/oliverbhull/memo-stt"
homepage = "https://github.com/oliverbhull/memo-stt"
documentation = "https://docs.rs/memo-stt"
readme = "README.md"
keywords = ["speech-to-text", "whisper", "stt", "transcription", "asr"]
categories = [
    "multimedia::audio",
    "science",
    "api-bindings",
]
exclude = [
    "models/*",
    "scripts/*",
    "target/*",
    ".github/*",
    ".cargo/*",
    "*.bin",
    "Cargo.lock",
]

[lib]
name = "memo_stt"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "memo-stt"
path = "src/main.rs"
required-features = ["binary"]

[features]
# Library-only by default so `cargo add memo-stt` stays lightweight.
# Install the standalone CLI with: `cargo install memo-stt --features binary`
default = []
binary = [
    "dep:cpal",
    "dep:rdev",
    "dep:enigo",
    "dep:audiopus",
    "dep:anyhow",
    "dep:log",
    "dep:btleplug",
    "dep:tokio",
    "dep:futures",
    "dep:uuid",
    "dep:base64",
]

[dependencies]
# Core: Whisper inference with optional Metal GPU acceleration on macOS.
whisper-rs = { version = "0.12", features = ["metal"] }

# Pick a sensible default thread count for transcription.
num_cpus = "1.0"

# Used to download the default model on first use.
ureq = { version = "2.9", default-features = false, features = ["tls"] }
dirs = "5.0"

# JSON output for the standalone binary.
serde_json = "1.0"

# Optional dependencies, enabled by the `binary` feature.
cpal = { version = "0.15", optional = true }
rdev = { version = "0.5", optional = true }
enigo = { version = "0.1", optional = true }
audiopus = { version = "0.2", optional = true }
anyhow = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
btleplug = { version = "0.11", optional = true }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1.23", features = ["v4"], optional = true }

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
